name: Android

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Versão (tag do release ou package.json)
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then V="$GITHUB_REF_NAME"; else V="v$(node -p "require('./package.json').version")"; fi
          echo "LUCIS_VERSION=$V" >> "$GITHUB_ENV"
          sed -i "s/__VERSION__/${V#[vV]}/g" www/index.html  # versão visível no rodapé do jogo
      - run: npx cap sync android

      - name: Restaurar keystore
        env:
          KEYSTORE_B64: ${{ secrets.LUCIS_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "LUCIS_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build (APK de teste + AAB da Play Store)
        working-directory: android
        env:
          LUCIS_KEYSTORE_PASSWORD: ${{ secrets.LUCIS_KEYSTORE_PASSWORD }}
          LUCIS_KEY_ALIAS: ${{ secrets.LUCIS_KEY_ALIAS }}
          LUCIS_KEY_PASSWORD: ${{ secrets.LUCIS_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: lucis-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

      - name: Publicar no release
        if: github.event_name == 'release' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$LUCIS_VERSION"
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$V"
          cp android/app/build/outputs/apk/release/app-release.apk "lucis-$V.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "lucis-$V.aab"
          (cd www && zip -qr "../lucis-$V-web.zip" .)
          # manifesto lido pelo app: versão, desde quando exige APK novo e o SHA-256 do pacote do jogo
          node -e '
            const fs=require("fs"),crypto=require("crypto"),[V,BASE]=process.argv.slice(1),pkg=require("./package.json");
            const sha=f=>crypto.createHash("sha256").update(fs.readFileSync(f)).digest("hex");
            fs.writeFileSync("update.json",JSON.stringify({version:V.replace(/^[vV]/,""),nativeSince:pkg.nativeSince,
              web:{url:`${BASE}/lucis-${V}-web.zip`,sha256:sha(`lucis-${V}-web.zip`)},
              apk:{url:`${BASE}/lucis-${V}.apk`,sha256:sha(`lucis-${V}.apk`)}},null,2))' "$V" "$BASE"
          cat update.json
          FILES="lucis-$V.apk lucis-$V.aab lucis-$V-web.zip update.json"
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            gh release upload "$V" $FILES --clobber
          elif ! gh release view "$V" >/dev/null 2>&1; then
            # versão nova no package.json -> cria o release já com todos os arquivos (publicação atômica)
            gh release create "$V" $FILES --target "$GITHUB_SHA" --title "Lucis $V" --generate-notes
          fi
